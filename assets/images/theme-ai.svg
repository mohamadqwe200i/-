<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رسم تجريدي يمثل شبكة ذكاء اصطناعي">
  <defs>
    <linearGradient id="aiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0984e3"/>
      <stop offset="1" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="aiNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0984e3"/>
      <stop offset="1" stop-color="#74b9ff"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#00b894" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00b894" stop-opacity="0"/>
    </radialGradient>
    <filter id="aiShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0984e3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="640" height="280" rx="24" fill="url(#aiBg)" opacity="0.06"/>
  <circle cx="320" cy="140" r="110" fill="url(#aiGlow)"/>

  <!-- زخارف عائمة -->
  <circle cx="95" cy="55" r="5" fill="#fdcb6e" opacity="0.8"/>
  <circle cx="555" cy="60" r="7" fill="#e17055" opacity="0.7"/>
  <circle cx="580" cy="220" r="5" fill="#0984e3" opacity="0.6"/>
  <circle cx="70" cy="225" r="6" fill="#00b894" opacity="0.7"/>

  <!-- خطوط الشبكة -->
  <g stroke="#0984e3" stroke-width="1.5" opacity="0.35">
    <line x1="180" y1="90" x2="320" y2="140"/>
    <line x1="180" y1="190" x2="320" y2="140"/>
    <line x1="320" y1="140" x2="460" y2="80"/>
    <line x1="320" y1="140" x2="460" y2="140"/>
    <line x1="320" y1="140" x2="460" y2="200"/>
    <line x1="180" y1="90" x2="180" y2="190"/>
    <line x1="460" y1="80" x2="460" y2="140"/>
    <line x1="460" y1="140" x2="460" y2="200"/>
  </g>

  <!-- عقد -->
  <g filter="url(#aiShadow)">
    <circle cx="180" cy="90" r="14" fill="url(#aiNode)"/>
    <circle cx="180" cy="190" r="14" fill="url(#aiNode)"/>
    <circle cx="320" cy="140" r="24" fill="#00b894"/>
    <circle cx="460" cy="80" r="12" fill="url(#aiNode)"/>
    <circle cx="460" cy="140" r="12" fill="url(#aiNode)"/>
    <circle cx="460" cy="200" r="12" fill="url(#aiNode)"/>
  </g>
  <circle cx="320" cy="140" r="9" fill="#ffffff" opacity="0.9"/>
</svg>
