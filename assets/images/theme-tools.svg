<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رسم تجريدي يمثل الأدوات">
  <defs>
    <linearGradient id="toolBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdcb6e"/>
      <stop offset="1" stop-color="#0984e3"/>
    </linearGradient>
    <radialGradient id="toolGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fdcb6e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="toolShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2d3436" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="640" height="280" rx="24" fill="url(#toolBg)" opacity="0.07"/>
  <circle cx="320" cy="140" r="115" fill="url(#toolGlow)"/>
  <circle cx="320" cy="140" r="90" fill="#ffffff" opacity="0.5"/>

  <!-- زخارف عائمة -->
  <circle cx="120" cy="70" r="5" fill="#00b894" opacity="0.8"/>
  <circle cx="530" cy="80" r="6" fill="#e17055" opacity="0.7"/>
  <circle cx="500" cy="215" r="5" fill="#0984e3" opacity="0.6"/>

  <g filter="url(#toolShadow)">
    <g transform="translate(275,95)">
      <circle cx="45" cy="45" r="38" fill="none" stroke="#0984e3" stroke-width="11"/>
      <rect x="35" y="-6" width="20" height="20" rx="4" fill="#0984e3"/>
      <rect x="35" y="76" width="20" height="20" rx="4" fill="#0984e3"/>
      <rect x="-6" y="35" width="20" height="20" rx="4" fill="#0984e3"/>
      <rect x="76" y="35" width="20" height="20" rx="4" fill="#0984e3"/>
      <circle cx="45" cy="45" r="14" fill="#ffffff"/>
    </g>
    <g transform="translate(150,150) rotate(45)">
      <rect x="0" y="0" width="18" height="75" rx="7" fill="#00b894"/>
      <rect x="-9" y="-14" width="36" height="22" rx="7" fill="#00b894"/>
    </g>
    <g transform="translate(440,150) rotate(-45)">
      <rect x="0" y="0" width="18" height="75" rx="7" fill="#e17055"/>
      <rect x="-9" y="-14" width="36" height="22" rx="7" fill="#e17055"/>
    </g>
  </g>
</svg>
