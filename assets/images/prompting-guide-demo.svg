<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رسم توضيحي لفكرة صياغة الأوامر بوضوح">
  <rect width="640" height="260" rx="20" fill="#0984e3" opacity="0.06"/>
  <!-- فقاعة سؤال غامض -->
  <rect x="40" y="90" width="220" height="90" rx="18" fill="#dfe6e9"/>
  <path d="M80 180 L80 205 L115 180 Z" fill="#dfe6e9"/>
  <text x="150" y="140" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="16" fill="#636e72">"سوّي لي شي..."</text>
  <text x="150" y="163" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="22" fill="#b2bec3">?</text>

  <!-- سهم -->
  <path d="M280 135 L360 135" stroke="#00b894" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00b894"/>
    </marker>
  </defs>

  <!-- فقاعة أمر واضح -->
  <rect x="380" y="70" width="220" height="130" rx="18" fill="#00b894"/>
  <path d="M420 200 L420 225 L455 200 Z" fill="#00b894"/>
  <text x="490" y="115" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="14" fill="#ffffff">الطول + الأسلوب</text>
  <text x="490" y="140" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="14" fill="#ffffff">+ الجمهور + الهدف</text>
  <text x="490" y="170" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="24" fill="#ffffff">✓</text>
</svg>
