<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ar' }}" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.name }}</title>
    <!-- استدعاء خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة المخططات البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- استدعاء ملف التصميم بالطريقة الصحيحة لـ Jekyll -->
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <!-- وسوم SEO/OpenGraph تلقائية (تحتاج جوهرة jekyll-seo-tag المفعّلة في _config.yml) -->
    {% seo %}
    <!-- رابط فييد RSS تلقائي (تحتاج جوهرة jekyll-feed) -->
    {% feed_meta %}
</head>
<body>
    <!-- شريط تقدم القراءة -->
    <div id="progress-bar"></div>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="{{ '/' | relative_url }}" class="logo">عالم<span>التقنية</span></a>
            <nav class="nav-links">
                <a href="{{ '/' | relative_url }}">الرئيسية</a>
                <button id="theme-toggle" aria-label="تبديل الوضع الليلي/النهاري">🌙</button>
            </nav>
        </div>
    </header>

    <!-- محتوى الصفحة أو المقال سيتم عرضه هنا تلقائياً -->
    <main class="container">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© {{ 'now' | date: "%Y" }} عالم التقنية. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- استدعاء ملف الجافاسكريبت بالطريقة الصحيحة لـ Jekyll -->
    <script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
