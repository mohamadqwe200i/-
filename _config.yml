name: عالم التقنية
title: عالم التقنية
description: "شروحات مبسطة، مقالات برمجية متخصصة، ومقارنات ذكية في عالم البرمجة والذكاء الاصطناعي."
lang: ar
markdown: kramdown

# عدّل هذا لرابط موقعك الفعلي بعد الرفع (يُستخدم من قبل SEO والفييد وخريطة الموقع أدناه)
url: "https://username.github.io"

# إضافات آمنة ومدعومة رسمياً من GitHub Pages تلقائياً:
# jekyll-seo-tag: وسوم SEO/OpenGraph جاهزة لكل صفحة
# jekyll-sitemap: يولّد sitemap.xml تلقائياً لمحركات البحث
# jekyll-feed: يولّد فييد RSS لمقالاتك (/feed.xml)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# مهم: بدون هذا الإعداد، Kramdown لا يفسّر الماركداون (# عناوين، **عريض**، جداول)
# إذا كانت داخل وسم HTML مثل <div>. المقالات في هذا الموقع تستخدم <div class="post-content">
# لذلك هذا السطر ضروري لتظهر المقالات منسّقة بشكل صحيح.
kramdown:
  parse_block_html: true

# إذا كان الموقع يُستضاف على GitHub Pages كـ "Project Page" على شكل:
#   https://username.github.io/اسم-المستودع/
# فعّل السطر التالي وضع اسم المستودع الفعلي (بدون هذا، كل الروابط والصور والـ CSS ستكون خاطئة):
# baseurl: "/اسم-المستودع"
#
# أما إذا كان الموقع مستضافاً كموقع مستخدم رئيسي على شكل:
#   https://username.github.io/
# فاترك baseurl فارغاً كما هو الآن (لا تضف السطر أعلاه).
